[{n:"New York City",lat:40.7128,lon:-74.0060,f:"🗽 The five boroughs make New York City the most populous city in the United States."},{n:"Buffalo",lat:42.8864,lon:-78.8784,f:"🌊 Buffalo sits at the eastern end of Lake Erie and is famous for its wings and historic architecture."},{n:"Rochester",lat:43.1566,lon:-77.6088,f:"📷 Rochester was once known as the world’s image-making capital, home to Kodak."},{n:"Albany",lat:42.6526,lon:-73.7562,f:"🏛️ New York’s capital, with a skyline dominated by the Empire State Plaza."},{n:"Syracuse",lat:43.0481,lon:-76.1474,f:"❄️ Syracuse is known for lake-effect snow and its historic role in the salt industry."}],
[{n:"Yonkers",lat:40.9312,lon:-73.8988,f:"🌉 New York’s fourth-largest city, just north of the Bronx along the Hudson River."},{n:"Ithaca",lat:42.4430,lon:-76.5019,f:"🎓 Home to Cornell University and Ithaca College, surrounded by Finger Lakes gorges."},{n:"Niagara Falls",lat:43.0962,lon:-79.0377,f:"💦 The city shares one of the world’s best-known waterfalls with Canada."},{n:"Saratoga Springs",lat:43.0831,lon:-73.7846,f:"🐎 Famous for its historic thoroughbred racetrack and mineral springs."},{n:"Binghamton",lat:42.0987,lon:-75.9180,f:"🧸 Once a major center of toy manufacturing, earning the nickname Toy Town."}],
[{n:"Poughkeepsie",lat:41.7004,lon:-73.9210,f:"🌉 The Walkway Over the Hudson crosses the river here on a former railroad bridge."},{n:"Kingston",lat:41.9270,lon:-73.9974,f:"📜 New York’s first capital after independence, before the seat of government moved to Albany."},{n:"New Rochelle",lat:40.9115,lon:-73.7824,f:"⚓ Founded by Huguenot refugees in 1688 and named after La Rochelle in France."},{n:"Lake Placid",lat:44.2795,lon:-73.9799,f:"🥇 Hosted the Winter Olympics in both 1932 and 1980."},{n:"Cooperstown",lat:42.7006,lon:-74.9243,f:"⚾ Home of the National Baseball Hall of Fame and Museum."}],
[{n:"Plattsburgh",lat:44.6995,lon:-73.4529,f:"⚓ The Battle of Plattsburgh in 1814 helped secure the northern frontier during the War of 1812."},{n:"Watertown",lat:43.9748,lon:-75.9108,f:"🌨️ Near Lake Ontario and the Thousand Islands, in one of the state’s snowiest regions."},{n:"Elmira",lat:42.0898,lon:-76.8077,f:"📚 Mark Twain spent many summers writing in a study overlooking Elmira."},{n:"Beacon",lat:41.5048,lon:-73.9696,f:"🎨 A former mill city turned arts destination, home to the Dia Beacon museum."},{n:"Hudson",lat:42.2529,lon:-73.7909,f:"🏘️ A Hudson River city known for its preserved 19th-century architecture and antiques."}],
[{n:"Montauk",lat:41.0359,lon:-71.9545,f:"🌅 At the eastern tip of Long Island, known for its lighthouse, beaches, and fishing."},{n:"Ticonderoga",lat:43.8487,lon:-73.4235,f:"🏰 Fort Ticonderoga guarded the strategic route between Lake Champlain and Lake George."},{n:"Oswego",lat:43.4553,lon:-76.5105,f:"🚢 A Lake Ontario port with a historic fort at the mouth of the Oswego River."},{n:"Corning",lat:42.1429,lon:-77.0547,f:"🧪 Home to the Corning Museum of Glass and a long history of glassmaking."},{n:"Riverhead",lat:40.9170,lon:-72.6620,f:"🍇 The Suffolk County seat, near Long Island’s North Fork vineyards and farms."}]
];
const MULT=[1,1,2,3,3],BAND=d=>d<10?"🎯":d<40?"🔥":d<120?"😬":"💀";
const $=id=>document.getElementById(id);
const ny=new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York"}).format(new Date());
const num=Math.round((Date.UTC(...ny.split("-").map((v,i)=>i===1?v-1:+v))-Date.UTC(2026,10,10))/864e5)+1;
// Retain hand-researched local trivia for towns already in the original pool.
const KNOWN_FACTS=Object.fromEntries(PZ.flat().filter(t=>t.f).map(t=>[t.n,t.f]));
// Load the 2024 Census Gazetteer for New York and filter it to useful communities.
const CENSUS_PLACES_URL="https://www2.census.gov/geo/docs/maps-data/data/gazetteer/2024_Gazetteer/2024_gaz_place_36.txt";
function puzzleForDay(dayNumber){
  let seed=(Math.imul(dayNumber,0x9e3779b1)^0x85ebca6b)>>>0;
  if(seed===0)seed=1;
  const random=()=>{
    seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;
    return (seed>>>0)/4294967296;
  };
  // Larger Census places are generally easier to recognize; small places make
  // progressively harder rounds. The seed keeps the daily set deterministic.
  const veryEasy=new Set(["New York City","New York","Buffalo","Rochester","Albany","Syracuse","Yonkers","Niagara Falls"]);
  const sorted=PZ.flat().slice().sort((a,b)=>(Number(veryEasy.has(b.n))-Number(veryEasy.has(a.n)))||(b.population-a.population)||(b.area-a.area));
  const tiers=Array.from({length:5},(_,i)=>{
    const start=Math.floor(i*sorted.length/5),end=Math.floor((i+1)*sorted.length/5);
    return sorted.slice(start,end);
  });
  return tiers.map(tier=>tier[Math.floor(random()*tier.length)]);
}
const censusReady=(async()=>{
  try{
    const response=await fetch(CENSUS_PLACES_URL,{cache:"force-cache"});
    if(!response.ok)throw new Error("Census Gazetteer returned "+response.status);
    const lines=(await response.text()).trim().split(/\r?\n/);
    // 2020 Decennial Census population is used only to filter CDPs and order
    // difficulty. Incorporated cities, boroughs, towns and municipalities stay.
    const populations=new Map();
    try{
      const popResponse=await fetch("https://api.census.gov/data/2020/dec/pl?get=NAME%2CP1_001N&for=place%3A%2A&in=state%3A36",{cache:"force-cache"});
      if(!popResponse.ok)throw new Error("2020 Census population API returned "+popResponse.status);
      const popRows=await popResponse.json();
      popRows.slice(1).forEach(row=>populations.set("36"+row[3],Number(row[1])||0));
    }catch(popError){console.warn("2020 population data unavailable; excluding CDPs:",popError);}
    const records=lines.slice(1).map(line=>line.split("\t")).filter(row=>row.length>=12&&row[0]==="NY");
    if(records.length<400)throw new Error("Incomplete New York Gazetteer: "+records.length+" records");
    const parsed=records.map(row=>{
      const rawName=row[3]||"";
      const match=rawName.match(/^(.*)\s+(city|borough|CDP|town|township|village|municipality)$/i);
      const name=(match?match[1]:rawName).trim();
      const type=match?match[2].toLowerCase():"place";
      const lat=Number(row[10]),lon=Number(row[11]),area=Number(row[8]),water=Number(row[9]);
      return {n:name,type,geoid:row[1],lat,lon,area:Number.isFinite(area)?area:0,water:Number.isFinite(water)?water:0};
    }).map(t=>({...t,population:populations.get(t.geoid)||0}));
    const included=parsed.filter(t=>{
      const incorporated=["city","borough","town","township","village","municipality"].includes(t.type);
      return incorporated||(t.type==="cdp"&&t.population>=5000);
    }).filter(t=>t.n&&Number.isFinite(t.lat)&&Number.isFinite(t.lon)&&t.lat>40.3&&t.lat<45.2&&t.lon>-80.1&&t.lon<-71.7);
    const counts={};included.forEach(t=>counts[t.n]=(counts[t.n]||0)+1);
    const typeCounts={};included.forEach(t=>{const key=t.n+"|"+t.type;typeCounts[key]=(typeCounts[key]||0)+1});
    PZ=included.map(t=>{
      let n=counts[t.n]>1?t.n+" ("+t.type+")":t.n;
      if(typeCounts[t.n+"|"+t.type]>1)n+=" · "+t.geoid;
      const land=t.area.toFixed(2),water=t.water.toFixed(2);
      const fact=KNOWN_FACTS[t.n]||("📍 Census geography fact: "+t.n+" is a New York "+t.type+" covering "+land+" square miles of land"+(t.water>0.005?" and "+water+" square miles of water.":"."));
      return {...t,n,f:fact};
    });
    console.info("Loaded "+PZ.length+" New York places (incorporated places plus CDPs with 5,000+ residents).");
  }catch(error){
    console.warn("Using built-in town bank; Census place download failed:",error);
  }
  puz=puzzleForDay(num);
  if(puz.every((town,index)=>town.n===yesterdayPuzzle[index].n))puz=puzzleForDay(num+104729);
})();
let puz=puzzleForDay(num);
// Avoid the same exact five-town lineup on two consecutive dates.
const yesterdayPuzzle=puzzleForDay(num-1);
let S={};try{S=JSON.parse(localStorage.getItem("ks-ny")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("ks-ny",JSON.stringify(S))}catch(e){}};
$("pn").textContent="Puzzle #"+num+" · "+ny;
$("streakL").textContent=S.streak?"🔥 "+S.streak+"-day streak":"";
function hav(a,b,c,d){const rad=Math.PI/180,x=Math.sin((c-a)*rad/2)**2+Math.cos(a*rad)*Math.cos(c*rad)*Math.sin((d-b)*rad/2)**2;return 12742*Math.asin(Math.sqrt(x))}
let r=0,pin=null,res=[],done=false,map=null,gameLayer=null,nyLayer=null,nyGeometry=null,mapReady=null,boundaryReady=null,countyLayer=null,countyFeatures=null;

// Imagery-only basemap with a separate New York outline; no road-label overlays.
const STATE_BOUNDARY_URL="https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/State_County/MapServer/0/query?where=STATE%3D%2736%27&outFields=NAME%2CGEOID&returnGeometry=true&outSR=4326&f=geoJSON";
const COUNTY_URL="https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/State_County/MapServer/19/query?where=STATE%3D%2736%27&outFields=NAME%2CGEOID&returnGeometry=true&outSR=4326&f=geoJSON";

function pointInRing(point,ring){
  const x=point.lng,y=point.lat;let inside=false;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];
    const crosses=((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi);
    if(crosses)inside=!inside;
  }
  return inside;
}
function pointInGeometry(latlng,geometry){
  if(!geometry)return false;
  const polygons=geometry.type==="Polygon"?[geometry.coordinates]:geometry.type==="MultiPolygon"?geometry.coordinates:[];
  return polygons.some(poly=>pointInRing(latlng,poly[0])&&!poly.slice(1).some(hole=>pointInRing(latlng,hole)));
}
function pointInNY(latlng){return pointInGeometry(latlng,nyGeometry)}
function countyForTown(town){
  const point={lat:town.lat,lng:town.lon};
  return countyFeatures.find(feature=>pointInGeometry(point,feature.geometry))||null;
}
async function revealCounty(town,roundIndex){
  if(countyLayer){map.removeLayer(countyLayer);countyLayer=null;}
  try{
    if(!countyFeatures){
      const response=await fetch(COUNTY_URL,{cache:"force-cache"});
      if(!response.ok)throw new Error("County boundary service returned "+response.status);
      const data=await response.json();
      countyFeatures=data.features||[];
      if(!countyFeatures.length)throw new Error("No New York county boundaries returned");
    }
  }catch(error){console.warn("County outlines unavailable:",error);countyFeatures=[];return "";}
  // Do not let a slow county request from an earlier round overwrite the new round.
  if(r!==roundIndex||!done)return "";
  const feature=countyForTown(town);
  if(!feature)return "";
  const layer=L.geoJSON(feature,{interactive:false,style:{color:"#d83a3a",weight:4,opacity:0,fillColor:"#d83a3a",fillOpacity:0}}).addTo(map);
  countyLayer=layer;
  const fadeStart=performance.now(),fadeDuration=1100;
  const fade=now=>{
    if(countyLayer!==layer)return;
    const progress=Math.min(1,(now-fadeStart)/fadeDuration);
    const eased=1-Math.pow(1-progress,3);
    layer.setStyle({opacity:eased,fillOpacity:.22*eased});
    if(progress<1)requestAnimationFrame(fade);
  };
  requestAnimationFrame(fade);
  layer.bringToFront();
  if(gameLayer)gameLayer.bringToFront();
  if(nyLayer)nyLayer.bringToFront();

}
async function initMap(){
  if(map){requestAnimationFrame(()=>map.invalidateSize());return;}
  if(mapReady)return mapReady;
  map=L.map("map",{

    touchZoom:true,dragging:true,boxZoom:false,keyboard:true,
    minZoom:5,maxZoom:14,zoomSnap:0.5
  }).setView([42.9,-75.5],6);
  L.tileLayer("https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{
    maxZoom:14,maxNativeZoom:14,keepBuffer:1,updateWhenZooming:false,

    if(done)return;

  })().catch(error=>{
    console.warn("New York outline unavailable:",error);
    $("info").textContent="The New York boundary is still loading. Please try again in a moment.";
  });
  return mapReady;
}
function resetMapView(){
  if(!map||!nyLayer)return;
  map.invalidateSize({pan:false});
  map.fitBounds(nyLayer.getBounds(),{padding:[12,12],animate:false});
}
function round(){
  const t=puz[r];pin=null;done=false;gameLayer.clearLayers();$("info").textContent="";
  if(countyLayer){map.removeLayer(countyLayer);countyLayer=null;}
  resetMapView();
  $("rd").textContent="Round "+(r+1)+" of 5 · ×"+MULT[r]+" multiplier";
  $("sc").textContent="Score: "+res.reduce((s,x)=>s+x.p,0);
  $("town").textContent=t.n;$("act").textContent="Drop a pin to continue";$("act").disabled=true;
}
$("go").onclick=async()=>{
  $("go").disabled=true;
  $("go").textContent="Loading your trip…";
  document.body.classList.add("playing");$("land").classList.add("hide");$("game").classList.remove("hide");
  try{await Promise.all([censusReady,initMap()]);round();}
  catch(e){$("game").classList.add("hide");$("land").classList.remove("hide");$("go").disabled=false;$("go").textContent="Try loading the map again";}
};
$("act").onclick=async()=>{
  if(done){r++;if(r<5)round();else finish();return;}
  if(!pin)return;
  const roundIndex=r,t=puz[roundIndex],glat=pin.lat,glon=pin.lng,d=hav(glat,glon,t.lat,t.lon);
  const multiplier=MULT[roundIndex],raw=d<=5?100:Math.max(0,Math.round(100*(1-(d-5)/245))),pts=raw*multiplier;
  res.push({p:pts,w:raw,d,b:BAND(d)});done=true;
  // The guess is confirmed; keep Next/Results clickable while county geometry loads.
  $("act").textContent=roundIndex<4?"Next round →":"See results";
  $("act").disabled=false;
  L.polyline([pin,[t.lat,t.lon]],{color:"#fff",weight:2,dashArray:"5, 6",opacity:.95}).addTo(gameLayer);
  L.circleMarker([t.lat,t.lon],{radius:7,color:"#fff",weight:2,fillColor:"#2f8f4e",fillOpacity:1}).addTo(gameLayer);
  $("info").innerHTML="<b>"+BAND(d)+" "+Math.round(d)+" km off · +"+raw+"/100"+(multiplier>1?" (×"+multiplier+" = "+pts+" pts)":" pts")+"</b><br>"+(t.f||"New York place; coordinates from the 2024 U.S. Census Gazetteer.");
  $("sc").textContent="Score: "+res.reduce((s,x)=>s+x.p,0);
  const countyName=await revealCounty(t,roundIndex);
  if(r===roundIndex&&done&&countyName){
    $("info").innerHTML+="<div class='county-note'>📍 "+countyName+" County highlighted on the map</div>";
  }
};
async function finish(){
  const tot=res.reduce((s,x)=>s+x.p,0);
  if(S.last!==ny){
    const yesterday=new Date(Date.parse(ny+"T12:00:00Z")-864e5).toISOString().slice(0,10);
    S.streak=S.last===yesterday?(S.streak||0)+1:1;
    S.last=ny;S.tot=tot;S.res=res;save();
  }
  show(S.tot,S.res);
  await submitDailyScore(S.tot);
}
// Submit at most one score per browser per day; the server enforces this with a
// UNIQUE(day, player_id) constraint. The ID is random and stays in localStorage.
function getPlayerId(){
  if(!S.playerId){S.playerId=(crypto.randomUUID?crypto.randomUUID():("p"+Date.now()+Math.random().toString(36).slice(2)));save();}
  return S.playerId;
}
async function loadDailyAverage(){
  try{
    const response=await fetch("/api/daily-average?game=ny&day="+encodeURIComponent(ny),{cache:"no-store"});
    if(!response.ok)throw new Error("Average endpoint returned "+response.status);
    const data=await response.json();
    $("dailyAvg").textContent=data.count
      ?"Today's average: "+Math.round(data.average)+" / 1000 ("+data.count+" "+(data.count===1?"player":"players")+")"
      :"Today's average: be the first to play!";
  }catch(error){
    $("dailyAvg").textContent="Today's average unavailable right now.";
    console.warn("Could not load daily average:",error);
  }
}
async function submitDailyScore(score){
  try{
    const response=await fetch("/api/score",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({day:ny,score,playerId:"ny-"+getPlayerId()})});
    if(!response.ok)throw new Error("Score endpoint returned "+response.status);
    await loadDailyAverage();
  }catch(error){
    $("dailyAvg").textContent="Daily average will appear when the score service is available.";
    console.warn("Could not submit daily score:",error);
  }
}
function show(tot,rs){
  $("land").classList.add("hide");$("game").classList.add("hide");$("recap").classList.remove("hide");
  $("tot").textContent=tot+" / 1000";$("strk").textContent="🔥 "+S.streak+"-day streak";
  const roundDifficulty=["Easy","Easy","Medium","Hard","Hard"];
  $("rows").innerHTML=puz.map((t,i)=>"<div class='row'><span>"+t.n+" <small class='round-tag'>("+roundDifficulty[i]+" "+MULT[i]+"×)</small></span><b>"+rs[i].b+" "+(rs[i].w??rs[i].p)+"/100</b></div><p class='ff'>"+(t.f||"New York place; coordinates from the 2024 U.S. Census Gazetteer.")+"</p>").join("");
  loadDailyAverage();
  window._share="New York State of Find #"+num+" — "+tot+"/1000 🔥 "+S.streak+"\n"+rs.map(x=>x.b+(x.w??x.p)).join(" · ")+"\nhttps://pinnsylvania.win/new-york";
  const tick=()=>{const now=new Date(),midnight=new Date(now);midnight.setHours(24,0,0,0);const seconds=Math.floor((midnight-now)/1000);$("cd").textContent="Next puzzle in "+Math.floor(seconds/3600)+"h "+Math.floor(seconds%3600/60)+"m"};
  tick();setInterval(tick,3e4);
}
$("share").onclick=async()=>{try{await navigator.clipboard.writeText(window._share);$("share").textContent="Copied! ✓"}catch(e){prompt("Copy your score:",window._share)}};
censusReady.then(()=>{if(S.last===ny&&S.res)show(S.tot,S.res)});
</script>
</body>
</html>
