<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keystone Pins — Daily PA Town Game</title>
<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#1b2a41;--mute:#6b7280;--navy:#1b3a6b;--gold:#c98a0b;--land:#e4dcc6;--line:#1b3a6b;--ok:#2f8f4e;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--card:#1a2232;--ink:#eef1f6;--mute:#9aa4b5;--navy:#7fa6e8;--gold:#f0b429;--land:#2a3347;--line:#7fa6e8;--ok:#5fcf84;--bad:#ff7b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151f;--card:#1a2232;--ink:#eef1f6;--mute:#9aa4b5;--navy:#7fa6e8;--gold:#f0b429;--land:#2a3347;--line:#7fa6e8;--ok:#5fcf84;--bad:#ff7b6b;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;min-height:100%}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:1.5rem;margin:.2rem 0;color:var(--navy);letter-spacing:.5px}
.sub{color:var(--mute);font-style:italic;margin:0 0 12px}
.card{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 1px 4px #0002;margin-bottom:12px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 18px;background:var(--navy);color:var(--bg);cursor:pointer;width:100%;font-size:1rem}
button:disabled{opacity:.4;cursor:default}
.hud{display:flex;justify-content:space-between;font-family:system-ui,sans-serif;font-size:.9rem;color:var(--mute);margin-bottom:6px}
.town{font-size:1.6rem;font-weight:700;text-align:center;margin:4px 0 8px}
svg{width:100%;height:auto;display:block;touch-action:manipulation;cursor:crosshair}
.pa{fill:var(--land);stroke:var(--line);stroke-width:1.5;stroke-linejoin:round}
.fact{margin:10px 0;line-height:1.45}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #8883;font-family:system-ui,sans-serif;font-size:.95rem}
.big{font-size:2.6rem;font-weight:700;text-align:center;color:var(--gold);margin:0}
.ff{font-size:.92rem;color:var(--mute);margin:2px 0 8px;line-height:1.35}
.hide{display:none}
</style></head><body><main>
<h1>📍 Keystone Pins</h1><p class="sub">How well do you actually know PA?</p>
<div id="land" class="card">
<p style="margin:0 0 4px"><b id="pn"></b></p>
<p class="ff">Place 5 towns on a blank map of Pennsylvania. Closer pins earn more points — 1,000 possible. New puzzle every day.</p>
<button id="go">Place the pin</button><p class="ff" id="streakL" style="text-align:center;margin-top:10px"></p></div>
<div id="game" class="hide">
<div class="hud"><span id="rd"></span><span id="sc"></span></div>
<div class="card"><div class="town" id="town"></div>
<svg id="map" viewBox="0 0 460 285"><path class="pa" id="pa"/><g id="mk"></g></svg>
<div id="info" class="fact"></div>
<button id="act" disabled>Tap the map to drop a pin</button></div></div>
<div id="recap" class="card hide"><p class="big" id="tot"></p><p class="sub" style="text-align:center" id="strk"></p>
<div id="rows"></div><button id="share" style="margin-top:12px">Share your score</button><p class="ff" id="cd" style="text-align:center;margin-top:10px"></p></div>
</main>
<script>
// Puzzle pool: facts must be human-reviewed before launch. Round order: easy → hard.
const PZ=[
[{n:"Philadelphia",lat:39.9526,lon:-75.1652,f:"🔔 William Penn founded it in 1682, and it served as the U.S. capital from 1790 to 1800."},
{n:"Hershey",lat:40.2859,lon:-76.6502,f:"🍫 Milton Hershey built the town for his chocolate factory workers; even the streetlamps are shaped like Kisses."},
{n:"Punxsutawney",lat:40.9434,lon:-78.9697,f:"🦫 Its famous groundhog, Phil, has predicted the weather every Groundhog Day since 1887."},
{n:"Centralia",lat:40.8056,lon:-76.3414,f:"🌋 A mine fire has burned beneath the borough since 1962, and nearly all residents have relocated."},
{n:"Emporium",lat:41.5114,lon:-78.2350,f:"🌲 It is the county seat of Cameron County, one of the least populous counties in Pennsylvania."}],
[{n:"Pittsburgh",lat:40.4406,lon:-79.9959,f:"🌉 The Allegheny and Monongahela rivers meet here to form the Ohio, and the city has hundreds of bridges."},
{n:"Gettysburg",lat:39.8309,lon:-77.2311,f:"🎖️ Site of the 1863 battle, and where Lincoln delivered his famous address that November."},
{n:"Jim Thorpe",lat:40.8751,lon:-75.7388,f:"🏅 Once called Mauch Chunk, it was renamed in 1954 for the Olympic champion athlete."},
{n:"Intercourse",lat:40.0373,lon:-76.1130,f:"🚜 A village in Lancaster County’s Amish country that draws plenty of sign-photo tourists."},
{n:"New Milford",lat:41.8751,lon:-75.7385,f:"🗺️ This Susquehanna County community sits just south of the New York border."}],
[{n:"Erie",lat:42.1292,lon:-80.0851,f:"⛵ Pennsylvania’s only Great Lakes port, sheltered by the Presque Isle peninsula."},
{n:"Scranton",lat:41.4090,lon:-75.6624,f:"⚡ Nicknamed the Electric City for its 1880s electric streetcars, and the setting of TV’s The Office."},
{n:"Johnstown",lat:40.3267,lon:-78.9220,f:"🌊 Devastated by the Great Flood of 1889 after the South Fork Dam failed."},
{n:"Bellefonte",lat:40.9134,lon:-77.7778,f:"⛲ The Centre County seat, whose name comes from French for “beautiful spring.”"},
{n:"Wellsboro",lat:41.7487,lon:-77.3008,f:"🏞️ The gateway to Pine Creek Gorge, the “Pennsylvania Grand Canyon,” and known for gas-lit streets."}]];
const MULT=[1,1,2,3,3],BAND=d=>d<10?"🎯":d<40?"🔥":d<120?"😬":"💀";
const PAPTS=[[-80.52,39.72],[-75.79,39.72],[-75.60,39.84],[-75.42,39.80],[-75.14,39.87],[-74.85,40.10],[-74.75,40.22],[-74.95,40.36],[-75.20,40.69],[-75.14,40.97],[-74.80,41.32],[-74.69,41.36],[-75.06,41.60],[-75.28,41.95],[-75.36,42.0],[-79.76,42.0],[-79.76,42.27],[-80.52,41.98],[-80.52,40.64]];
const X=lo=>(lo+80.6)*75.5,Y=la=>(42.4-la)*100;
const $=i=>document.getElementById(i);
$("pa").setAttribute("d","M"+PAPTS.map(p=>X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join("L")+"Z");
const ny=new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York"}).format(new Date());
const num=Math.round((Date.UTC(...ny.split("-").map((v,i)=>i==1?v-1:+v))-Date.UTC(2026,10,10))/864e5)+1;
const puz=PZ[((num-1)%PZ.length+PZ.length)%PZ.length];
let S={}; try{S=JSON.parse(localStorage.getItem("ks")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("ks",JSON.stringify(S))}catch(e){}};
$("pn").textContent="Puzzle #"+num+" · "+ny;
$("streakL").textContent=S.streak?"🔥 "+S.streak+"-day streak":"";
function hav(a,b,c,d){const r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 12742*Math.asin(Math.sqrt(x))}
let r=0,pin=null,res=[],done=false;
const NS="http://www.w3.org/2000/svg";
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);$("mk").appendChild(e);return e}
function round(){const t=puz[r];pin=null;done=false;$("mk").innerHTML="";$("info").textContent="";
$("rd").textContent="Round "+(r+1)+" of 5 · ×"+MULT[r]+" multiplier";$("sc").textContent="Score: "+res.reduce((s,x)=>s+x.p,0);
$("town").textContent=t.n;$("act").textContent="Tap the map to drop a pin";$("act").disabled=true}
$("go").onclick=()=>{$("land").classList.add("hide");$("game").classList.remove("hide");round()};
$("map").addEventListener("click",e=>{if(done)return;const s=$("map"),pt=s.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
const q=pt.matrixTransform(s.getScreenCTM().inverse());pin={x:q.x,y:q.y};$("mk").innerHTML="";
el("circle",{cx:q.x,cy:q.y,r:5,fill:"var(--bad)",stroke:"#fff","stroke-width":1.5});$("act").disabled=false;$("act").textContent="Confirm guess"});
$("act").onclick=()=>{
if(done){r++;r<5?round():finish();return}
const t=puz[r],glat=42.4-pin.y/100,glon=pin.x/75.5-80.6,d=hav(glat,glon,t.lat,t.lon),
raw=d<=5?100:Math.max(0,Math.round(100*(1-(d-5)/245))),pts=raw*MULT[r];
res.push({p:pts,w:raw,d,b:BAND(d)});done=true;
el("line",{x1:pin.x,y1:pin.y,x2:X(t.lon),y2:Y(t.lat),stroke:"var(--ink)","stroke-width":1.5,"stroke-dasharray":"4 3"});
el("circle",{cx:X(t.lon),cy:Y(t.lat),r:6,fill:"var(--ok)",stroke:"#fff","stroke-width":1.5});
$("info").innerHTML="<b>"+BAND(d)+" "+Math.round(d)+" km off · +"+raw+"/100"+(MULT[r]>1?" (×"+MULT[r]+" = "+pts+" pts)":" pts")+"</b><br>"+t.f;
$("sc").textContent="Score: "+res.reduce((s,x)=>s+x.p,0);
$("act").textContent=r<4?"Next town →":"See results"};
function finish(){const tot=res.reduce((s,x)=>s+x.p,0);
if(S.last!==ny){const y=new Date(Date.parse(ny+"T12:00:00Z")-864e5).toISOString().slice(0,10);S.streak=S.last===y?(S.streak||0)+1:1;S.last=ny;S.tot=tot;S.res=res;save()}
show(S.tot,S.res)}
function show(tot,rs){$("land").classList.add("hide");$("game").classList.add("hide");$("recap").classList.remove("hide");
$("tot").textContent=tot+" / 1000";$("strk").textContent="🔥 "+S.streak+"-day streak";
$("rows").innerHTML=puz.map((t,i)=>"<div class='row'><span>"+rs[i].b+" "+t.n+"</span><b>"+(rs[i].w??rs[i].p)+"/100"+(MULT[i]>1?" ×"+MULT[i]:"")+"</b></div><p class='ff'>"+t.f+"</p>").join("");
window._share="Keystone Pins #"+num+" — "+tot+"/1000 🔥 "+S.streak+"\n"+rs.map(x=>x.b+(x.w??x.p)).join(" · ")+"\nkeystonepins.com";
const tick=()=>{const n=new Date(),m=new Date(n);m.setHours(24,0,0,0);const s=Math.floor((m-n)/1000);$("cd").textContent="Next puzzle in "+Math.floor(s/3600)+"h "+Math.floor(s%3600/60)+"m"};tick();setInterval(tick,3e4)}
$("share").onclick=async()=>{try{await navigator.clipboard.writeText(window._share);$("share").textContent="Copied! ✓"}catch(e){prompt("Copy your score:",window._share)}};
if(S.last===ny&&S.res)show(S.tot,S.res);
</script></body></html>
